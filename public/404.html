<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Flow</title>
    <script>
      var base = "/Brain-Dump";
      var path = window.location.pathname.slice(base.length) || "/";
      var search = window.location.search;
      var hash = window.location.hash;
      var redirect = base + "/?p=" + encodeURIComponent(path + search + hash);
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
